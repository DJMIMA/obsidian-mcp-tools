name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

# action は SHA で、Bun は版で固定する（ci.yml と同じ）。テストが通ってから
# Release を作るので、失敗したときに空の Release が残らない。
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test mcp-server
        working-directory: packages/mcp-server
        run: bun test

      - name: Test obsidian-plugin
        working-directory: packages/obsidian-plugin
        run: bun test src

      # mcp-server: 全プラットフォームのバイナリ。obsidian-plugin: main.js と zip
      - name: Build
        run: bun run release

      - name: Check the version matches the tag
        run: test "$(./packages/mcp-server/dist/mcp-server-linux --version)" = "$GITHUB_REF_NAME"

      - name: Generate artifact attestation for MCP server binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "packages/mcp-server/dist/*"

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ✨ This release includes attested build artifacts.
            📝 View attestation details in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            packages/obsidian-plugin/releases/obsidian-plugin-*.zip
            main.js
            manifest.json
            packages/mcp-server/dist/*
