name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# action はタグではなくコミット SHA で固定する（タグは付け替えられる）。Dependabot が SHA ごと更新する。
# Bun も版を固定する。上げるときは release.yml と揃える。

jobs:
  # 依存の脆弱性。1 件でもあれば失敗させる。型チェックやテストの結果が隠れないよう別ジョブにしている。
  # bun audit は bun.lock だけを見るので bun install は要らない
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Audit dependencies
        run: |
          set +e
          bun audit > audit.txt 2>&1
          status=$?
          set -e
          summary=$(grep -E '^[0-9]+ vulnerabilit' audit.txt | tail -n 1)
          if [ $status -eq 0 ]; then
            summary="No vulnerabilities found"
          elif [ -z "$summary" ]; then
            summary="bun audit exited with $status (see the job summary)"
          fi
          {
            echo "## bun audit"
            echo
            echo "$summary"
            echo
            echo "<details><summary>Full output</summary>"
            echo
            echo '```'
            cat audit.txt
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            echo "::error title=bun audit::$summary"
            exit $status
          fi

  # 型チェック・lint・テスト・プラグインのビルドと、Linux 向けサーバのビルドを確かめる
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Test mcp-server
        working-directory: packages/mcp-server
        run: bun test

      - name: Test obsidian-plugin
        working-directory: packages/obsidian-plugin
        run: bun test src

      - name: Build obsidian-plugin
        working-directory: packages/obsidian-plugin
        run: |
          bun run build
          test -s ../../main.js

      - name: Build mcp-server (linux)
        working-directory: packages/mcp-server
        run: |
          bun run build:linux
          test "$(./dist/mcp-server-linux --version)" = "$(jq -r .version ../../package.json)"

  # 実際に使う Windows バイナリを作り、テストも Windows 上で回す
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test mcp-server
        working-directory: packages/mcp-server
        run: bun test

      - name: Test obsidian-plugin
        working-directory: packages/obsidian-plugin
        run: bun test src

      - name: Build obsidian-plugin
        working-directory: packages/obsidian-plugin
        run: bun bun.config.ts --prod

      - name: Build mcp-server (windows)
        working-directory: packages/mcp-server
        run: |
          bun run build:windows
          test "$(./dist/mcp-server-windows.exe --version | tr -d '\r')" = "$(jq -r .version ../../package.json)"

      # vault へ手で置く 3 ファイル。bin/mcp-server.exe へはリネームして置く
      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-tools-windows-${{ github.sha }}
          path: |
            main.js
            manifest.json
            packages/mcp-server/dist/mcp-server-windows.exe
          if-no-files-found: error
          retention-days: 14
