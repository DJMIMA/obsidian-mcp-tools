version: 2

updates:
  # ルートの bun.lock がワークスペース全体（packages/*）を持つので directory は "/" だけでよい
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    # minor / patch は 1 本の PR にまとめる。major は個別に出る
    groups:
      bun-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
