version: 2

updates:
  # ルートの bun.lock がワークスペース全体（packages/*）を持つので directory は "/" だけでよい
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    # minor / patch は 1 本の PR にまとめる。major は個別に出る
    groups:
      bun-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Local REST API は実行時に Express 4 で動き、npm パッケージ obsidian-local-rest-api の
      # peer も @types/express ^4。5 の型にするとルートのハンドラの型が合わなくなる（PR #14）。
      # obsidian-local-rest-api の peer が ^5 になったら外す。
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
